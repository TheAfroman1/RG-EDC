# The onboard card is driven by the static rg_rotate_speaker sink
# (pipewire.conf.d/60-rg-rotate-speaker.conf). Keep ACP from creating a
# second sink on the same PCM.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card._sys_devices_platform_sound*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
