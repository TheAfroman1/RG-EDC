# The speaker runs at a fixed 1280-frame quantum (see pipewire.conf.d/
# 60-rg-rotate-speaker.conf). Pulse clients (RetroArch, the RG EDC shell's
# music, SDL games) that ask for the usual 5 ms requests can't keep up with
# 26.7 ms cycles and underrun, which sounds like crackles and dropouts.
# Never hand them requests smaller than one cycle, and keep two in flight.
pulse.properties = {
  pulse.min.req     = 1280/48000
  pulse.default.req = 1280/48000
  pulse.min.frag    = 1280/48000
  pulse.min.quantum = 1280/48000
  pulse.default.tlength = 3840/48000
}
