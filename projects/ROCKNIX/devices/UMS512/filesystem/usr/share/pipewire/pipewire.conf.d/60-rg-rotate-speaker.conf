# The sprdphone-sc2730 card exposes a dozen DSP front-ends and no standard
# ALSA profile, so PipeWire's ACP probing creates no sink for it.
# Open the normal playback front-end (FE_ST_NORMAL_AP01) directly.
# The DSP path wants periods in multiples of 160 frames (upstream uses
# 1280 x 8) and IRQ-driven scheduling.
context.properties = {
  default.clock.quantum     = 1280
  default.clock.min-quantum = 1280
  default.clock.max-quantum = 1280
}
context.objects = [
  { factory = adapter
    args = {
      factory.name     = api.alsa.pcm.sink
      node.name        = "rg_rotate_speaker"
      node.description = "RG Rotate Speaker"
      media.class      = "Audio/Sink"
      api.alsa.path    = "hw:sprdphonesc2730,0"
      audio.format     = "S16LE"
      audio.rate       = 48000
      audio.channels   = 2
      audio.position   = [ FL FR ]
      api.alsa.period-size    = 1280
      api.alsa.period-num     = 8
      api.alsa.disable-tsched = true
      priority.driver  = 1000
      priority.session = 500
    }
    # Keep PipeWire running (Bluetooth, USB DACs) even if the speaker
    # cannot be opened, e.g. when another config already holds it.
    flags = [ nofail ]
  }
]
