# The sprdphone-sc2730 card exposes a dozen DSP front-ends and no standard
# ALSA profile, so PipeWire's ACP probing creates no sink for it.
# Open the normal playback front-end (FE_ST_NORMAL_AP01) directly.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = api.alsa.pcm.sink
      node.name        = "rg_rotate_speaker"
      node.description = "RG Rotate Speaker"
      media.class      = "Audio/Sink"
      api.alsa.path    = "hw:sprdphonesc2730,0"
      audio.format     = "S16LE"
      audio.rate       = 48000
      audio.channels   = 2
      audio.position   = [ FL FR ]
      priority.driver  = 2000
      priority.session = 2000
    }
  }
]
